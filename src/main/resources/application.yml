spring:
  application:
    name: ms-user
  datasource:
    url: ${DB_USER:jdbc:mysql://host.docker.internal:3306/user_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Clase1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1
server:
  port: 8081
control:
  exception:
    perzonalisada: Se genero error de negocio
    system: Se genero error del sistema